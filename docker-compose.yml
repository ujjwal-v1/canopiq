version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: canopiq
      POSTGRES_PASSWORD: password
      POSTGRES_DB: canopiq
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canopiq"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/root/uploads
    environment:
      - DATABASE_URL=postgresql://canopiq:password@db:5432/canopiq

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:8000
        - VITE_CLERK_PUBLISHABLE_KEY=pk_test_Y29oZXJlbnQtYW5jaG92eS05NS5jbGVyay5hY2NvdW50cy5kZXYk
    ports:
      - "5173:5173"

volumes:
  pg_data:
